name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: notelook-windows-x86_64.zip
            bin_ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: notelook-linux-x86_64.tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: notelook-macos-arm64.tar.gz
            bin_ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies and setup swap (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Clear any active swap cleanly and establish a 7GB swapfile
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile_gh
          sudo dd if=/dev/zero of=/mnt/swapfile_gh bs=1M count=7168 status=progress
          sudo chmod 600 /mnt/swapfile_gh
          sudo mkswap /mnt/swapfile_gh
          sudo swapon /mnt/swapfile_gh
          free -h

          # 2. Install GUI dependencies
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev pkg-config
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/notelook.exe release/
          cp target/${{ matrix.target }}/release/cli.exe release/
          if (Test-Path "README.md") { cp README.md release/ }
          # Copy LICENSE regardless of whether it is named LICENSE, LICENSE.txt, or LICENSE.md
          $license = Get-ChildItem -Path . -Filter "LICENSE*" | Select-Object -First 1
          if ($license) { cp $license.FullName release/LICENSE }
          Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix artifacts
        if: matrix.os != 'windows-latest'
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/notelook release/
          cp target/${{ matrix.target }}/release/cli release/
          [ -f README.md ] && cp README.md release/
          # Copy LICENSE regardless of whether it is named LICENSE, LICENSE.txt, or LICENSE.md
          find . -maxdepth 1 -name "LICENSE*" -exec cp {} release/LICENSE \;
          tar -czvf ${{ matrix.artifact_name }} -C release .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: ${{ matrix.artifact_name }}
