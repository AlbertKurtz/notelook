name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: notelook-windows-x86_64.zip
            bin_ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: notelook-linux-x86_64.tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: notelook-macos-arm64.tar.gz
            bin_ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies and setup swap (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Allocate 6GB swap to prevent Linker/LLVM OOM (exit code 143)
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          # 2. Install GUI dependencies
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev pkg-config

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/notelook.exe release/
          cp target/${{ matrix.target }}/release/cli.exe release/
          cp README.md release/
          cp LICENSE release/
          Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix artifacts
        if: matrix.os != 'windows-latest'
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/notelook release/
          cp target/${{ matrix.target }}/release/cli release/
          cp README.md release/
          cp LICENSE release/
          tar -czvf ${{ matrix.artifact_name }} -C release .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: ${{ matrix.artifact_name }}
